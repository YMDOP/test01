server:
  port: 8081
  address: 127.0.0.1
  shutdown: graceful

spring:
  main:
    banner-mode: off
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.love.interviewforge: INFO
  file:
    name: ${app.data-dir}/logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
